<!DOCTYPE html>
<html>
<head>
    <title>Iris Flower Prediction</title>
</head>

<body>
    <h1>Iris Flower Species Prediction</h1>

    <form method="POST">

        <label>Sepal Length:</label>
        <input
            type="number"
            name="sepal_length"
            step="any"
            min="0.01"
            max="10"
            required
        >
        <br><br>

        <label>Sepal Width:</label>
        <input
            type="number"
            name="sepal_width"
            step="any"
            min="0.01"
            max="10"
            required
        >
        <br><br>

        <label>Petal Length:</label>
        <input
            type="number"
            name="petal_length"
            step="any"
            min="0.01"
            max="10"
            required
        >
        <br><br>

        <label>Petal Width:</label>
        <input
            type="number"
            name="petal_width"
            step="any"
            min="0.01"
            max="10"
            required
        >
        <br><br>

        <button type="submit">Predict Species</button>

    </form>

    {% if prediction %}
        <h2>Predicted Species: {{ prediction }}</h2>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</body>
</html>
